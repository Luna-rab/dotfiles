# .claude/skills/ 配下の壊れ（frontmatter の YAML 崩れ、リンク切れ、実行権限の欠落など）を、
# push と pull request のたびに検出する。
#
# 検査スクリプトは .claude/scripts/check-skills.py が提供する。引数なし・リポジトリのルートから
# 実行・終了コード 0（合格）/ 1（不合格）という形を守って呼ぶ。
name: skill-checks

on:
  push:
  pull_request:

jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ubuntu-latest には python3 が入っているが PyYAML は入っていないため、ここで入れる。
      - name: Install PyYAML
        run: pip install PyYAML

      - name: Check .claude/skills/ の frontmatter・行数・リンク・実行権限
        run: python3 .claude/scripts/check-skills.py
