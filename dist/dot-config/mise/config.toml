# mise（プログラミング言語やコマンドラインツールのバージョンを管理するツール）が
# 全環境に入れるツールの一覧。
#
# install.sh がこのファイルを ~/.config/mise/config.toml に symlink し、そのあと
# `mise install` を実行して、ここに書いてあって未インストールのツールを入れる。
#
# ~/.zshrc はツールを入れない。`mise activate` で PATH に載せるだけにして、
# 入れる処理は install.sh の 1 か所に集める。
[tools]
# sheldon: zsh のプラグインマネージャ。~/.zshrc が `sheldon source` を呼ぶため、
# これが無いと zsh の起動に失敗する。
sheldon = "latest"
# ghq: git リポジトリを $(ghq root) 配下に決まった形で clone して並べるツール。
ghq = "latest"
# fzf: 候補を絞り込んで 1 つ選ぶツール。~/.zshrc の ghq-fzf と gs が使う。
fzf = "latest"
node = "lts"
python = "3.12"
# uv: Python のパッケージと仮想環境を扱うツール。~/.claude/hooks/ のスクリプトは shebang を
# `#!/usr/bin/env -S uv run --script` にしてあり、要るパッケージを PEP 723 の
# `# /// script` で自分で宣言する。uv がそれを読んで取り寄せる。
# **これが無いと ~/.claude/hooks/ のフックが起動に失敗する。**
uv = "latest"

# 言語サーバ（LSP）。Claude Code は定義・参照・シンボル検索・型エラーをここから取る。
# Claude Code 自体は言語サーバを持たず、実行ファイルを PATH から探すだけなので、
# 入れるのはこちらの仕事。どのファイル拡張子をどのサーバに渡すかは
# ~/.claude/settings.json の enabledPlugins で有効にした公式 plugin
# （typescript-lsp / pyright-lsp / php-lsp）が決める。plugin だけ有効にして実行ファイルが
# 無いと、その言語では何も引けない。
#
# どれも mise のレジストリに無いので npm から入れる（mise 2026.8.2 で確認）。
#
# typescript-language-server: .ts .tsx .js .jsx などを見る。
# **解析に使う tsserver は、開いているリポジトリの node_modules/typescript から取る。**
# ここに `npm:typescript` を足しても効かない。mise は npm パッケージごとに別の
# node_modules を作るので、このサーバからは見えないため（実測: initialize が
# 「Could not find a valid TypeScript installation」で失敗する）。
# つまり `npm ci` を通していないリポジトリでは TypeScript の解析が動かない。
"npm:typescript-language-server" = "latest"
# pyright: .py .pyi を見る。実行ファイル名は pyright-langserver。
"npm:pyright" = "latest"
# intelephense: .php を見る。無料のままで定義・参照・診断は動く。
# 有料の機能（リネームなど）を使うならライセンスキーを登録する。
"npm:intelephense" = "latest"
