# このリポジトリの Python コードを検査するための設定。
#
# **配布には要らない。** ここに書いてあるのは開発と CI だけで使う道具（ruff・ty）の設定で、
# dotfiles を入れた人がこれらを持っている必要はない。
#
# 使い方:
#   uv run ruff check .          問題を挙げる
#   uv run ruff check --fix .    自動で直せるものを直す
#   uv run ruff format .         整形する
#   uv run ty check              型を検査する
#
# uv は dist/dot-config/mise/config.toml に入れてあるので、install.sh を通したマシンには
# 入っている。

[project]
name = "dotfiles"
version = "0"
description = "Claude Code のスキルと zsh などの設定。ここでは Python コードの検査設定だけを持つ"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
# `uv run ruff` / `uv run ty` / `uv run pytest` が使う。実行時には要らない。
# pyyaml と tree-sitter-language-pack が入っているのは、ty が check-skills.py の
# `import yaml` と dist/dot-claude/hooks/review-new-comments.py の
# `import tree_sitter_language_pack` を解決し、pytest がフックを関数として呼べるように
# するため。実行時の依存はスクリプト自身が PEP 723（`# /// script`）で宣言している
dev = [
  "ruff>=0.16",
  "ty>=0.0.72",
  "pytest>=8",
  "pyyaml>=6",
  "tree-sitter-language-pack>=0.13",
]

# パッケージとして配るものではないので、ビルドバックエンドを持たせない
[tool.uv]
package = false

[tool.ruff]
# スキルのスクリプトが動く最低ラインに合わせる。ここを上げると、古い python3 しか
# 入っていないマシンで動かない構文を ruff が許してしまう
target-version = "py310"
line-length = 100
exclude = [
  # git worktree の実体。エージェントが作った他ブランチのチェックアウトが入っており、
  # このリポジトリのソースではない（.gitignore でも追跡から外してある）
  ".claude/worktrees",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle（エラー）
  "W",    # pycodestyle（警告）
  "F",    # Pyflakes（未使用・未定義）
  "I",    # import の並び
  "UP",   # 新しい構文への追随（f-string など）
  "B",    # bugbear（間違えやすい書き方）
  "SIM",  # 単純化できる分岐・with
  "PL",   # Pylint 由来
  "RUF",  # ruff 固有
]
ignore = [
  # 日本語のコメントと文字列を多く含むため、行長は formatter に任せて lint では見ない
  "E501",
  # 引数が多い関数を許す。argparse のサブコマンド定義で自然に増える
  "PLR0913",
  # マジックナンバーの比較を許す。終了コードの 0 / 1 を定数にしても読みやすくならない
  "PLR2004",
  # 全角の読点・括弧・コロンを「半角と紛らわしい文字」として弾くルール。このリポジトリは
  # コメントもエラーメッセージも日本語で書く方針なので、当てると 272 件すべてが誤検出になる
  "RUF001", # 文字列の中
  "RUF002", # docstring の中
  "RUF003", # コメントの中
]

[tool.ruff.lint.per-file-ignores]
# lib/__init__.py は re-export だけを行うので、未使用 import に見える
"**/lib/__init__.py" = ["F401"]
# 検査の関数名を日本語で書くので、識別子の非 ASCII を弾く PLC2401 を検査だけ外す。
# 落ちたときに pytest が出す名前だけで「何が壊れたか」が読める
# （`test_2度目を忘れると落ちたままになる`）
"test/**" = ["PLC2401"]

[tool.ty.environment]
python-version = "3.10"
# スクリプトが自分のディレクトリを起点に import するので、その起点を教える
# （autodev は `from autodevlib import ...`）。
extra-paths = [
  "dist/dot-claude/skills/autodev/scripts",
]

[tool.ty.src]
# **`!dist` を外すと配布物が検査されない。** ty の既定の除外に `dist` が入っており、
# この `exclude` は既定を置き換えず足すだけなので、`!` で打ち消さないと
# 「All checks passed!」がスキルのスクリプトについて何も言わなくなる。
exclude = [".claude/worktrees", "!dist"]

[tool.pytest.ini_options]
# 検査は `test/` にだけ置く。**`dist/` の中には置かない**——`dist/` は $HOME へ配るもので、
# install.sh を通した人に検査は要らない。`test/` の下は対象を写した形にしてある
# （`test/autodev/` が `dist/dot-claude/skills/autodev/`、`test/dot-claude/` が
# `dist/dot-claude/`）
testpaths = ["test"]
